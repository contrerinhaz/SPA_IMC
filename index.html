<body>
    <header>
        <h1>Calculadora Del IMC</h1>
    </header>
    <main>
        <label for="peso">Peso en KG:</label>
        <input type="number" id="peso" placeholder="Ejemplo: 50">

        <label for="altura">Altura en Metros:</label>
        <input type="number" step="0.01" id="altura" placeholder="Ejemplo: 1.85">

        <button id="boton">Calcular</button>

        <section id="resultado" class="resultado"></section>
    </main>
    <footer>
        <P>:P</P>
    </footer>
    <script src="./src/js/main.js"></script>
